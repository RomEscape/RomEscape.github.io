name: 사이트 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: PPT를 PDF로 변환
        run: |
          shopt -s nullglob globstar nocaseglob
          files=(uploads/**/*.ppt uploads/**/*.pptx)
          if [ ${#files[@]} -gt 0 ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends libreoffice-impress fonts-noto-cjk fonts-nanum
            mkdir -p _converted
            soffice --headless --convert-to pdf --outdir _converted "${files[@]}"
          fi
          # ponytail: 올릴 때마다 전부 다시 변환함. 발표자료가 많아져 느려지면 변환본을 캐시할 것

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 사이트 만들기
        run: |
          pip install -q -r requirements.txt
          python build.py selftest
          python build.py build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
