name: 연구 기록
tagline: 언어 모델의 적응형 추론과 한국어 페르소나 대화 모델 연구 기록
intro: |
  두 가지를 연구합니다. 대형 언어 모델이 문제에 맞는 만큼만 생각하도록 만드는 방법(QFFT), 그리고 실존 예술가처럼 말하는 한국어 대화 모델(페르소나 LLM)입니다. 실험 과정과 결과, 발표자료를 이곳에 정리합니다.
about: |
  **연구 주제:** 언어 모델의 적응형 추론, 추론 효율, 질문 없는 미세조정(QFFT)

  **개발 과제:** 한국어 페르소나 LLM(인물 대화 모델, 다른 시스템의 답을 인물 말투로 바꾸는 화법 변환, 대화로 그림 요청을 모으는 프롬프트 생성)

  연락과 코드는 아래 GitHub 링크를 이용해 주세요.
links:
